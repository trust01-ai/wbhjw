<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Email</title>
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>
<body>
    <h1>Your email: <span id="emailDisplay">loading...</span></h1>

    <script>
        const CLIENT_ID = "a1950e1b-e1fb-40b6-8cfa-bc42c08770c2"; // Your ID

        const msalConfig = {
            auth: {
                clientId: CLIENT_ID,
                authority: "https://login.microsoftonline.com/common",
                redirectUri: window.location.origin,
            },
            cache: { cacheLocation: "localStorage" }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);

        // PRIORITY 1: preferred_username (ALWAYS works for O365)
        // PRIORITY 2: email (works if optional claim is added)
        function getEmail(claims) {
            return claims.preferred_username || 
                   claims.email || 
                   claims.upn || 
                   claims.unique_name ||
                   "unknown";
        }

        msalInstance.handleRedirectPromise()
            .then(response => {
                if (response) {
                    const email = getEmail(response.idTokenClaims);
                    document.getElementById('emailDisplay').textContent = email;
                    console.log("Email found:", email); // Check console for debugging
                } else {
                    trySilent();
                }
            })
            .catch(err => {
                console.error("Redirect error:", err);
                document.getElementById('emailDisplay').textContent = "error";
            });

        async function trySilent() {
            try {
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length > 0) {
                    const response = await msalInstance.acquireTokenSilent({
                        scopes: ["openid", "email", "profile"],
                        account: accounts[0]
                    });
                    displayEmail(response);
                } else {
                    const response = await msalInstance.ssoSilent({
                        scopes: ["openid", "email", "profile"]
                    });
                    displayEmail(response);
                }
            } catch (err) {
                console.log("Silent failed, redirecting:", err);
                msalInstance.loginRedirect({ scopes: ["openid", "email", "profile"] });
            }
        }

        function displayEmail(response) {
            const email = getEmail(response.idTokenClaims);
            document.getElementById('emailDisplay').textContent = email;
            console.log("Full claims:", response.idTokenClaims); // Debug: see all claims
        }
    </script>
</body>
</html>
