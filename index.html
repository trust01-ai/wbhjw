<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Email</title>
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>
<body>
    <h1>Your email: <span id="emailDisplay">loading...</span></h1>

    <script>
        // REPLACE THIS WITH YOUR ACTUAL CLIENT ID
        const CLIENT_ID = "a1950e1b-e1fb-40b6-8cfa-bc42c08770c2";

        const msalConfig = {
            auth: {
                clientId: CLIENT_ID,
                authority: "https://login.microsoftonline.com/common",
                redirectUri: window.location.origin, // auto-detects your URL
            },
            cache: { cacheLocation: "localStorage" }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);

        // Handle redirect after login
        msalInstance.handleRedirectPromise()
            .then(response => {
                if (response) {
                    const email = response.idTokenClaims.email ||
                                  response.idTokenClaims.preferred_username;
                    document.getElementById('emailDisplay').textContent = email;
                } else {
                    trySilent();
                }
            })
            .catch(() => document.getElementById('emailDisplay').textContent = "error");

        // Try silent authentication (no popup)
        async function trySilent() {
            try {
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length > 0) {
                    const response = await msalInstance.acquireTokenSilent({
                        scopes: ["openid", "email", "profile"],
                        account: accounts[0]
                    });
                    displayEmail(response);
                } else {
                    const response = await msalInstance.ssoSilent({
                        scopes: ["openid", "email", "profile"]
                    });
                    displayEmail(response);
                }
            } catch {
                // Fallback: redirect to login page (happens once)
                msalInstance.loginRedirect({ scopes: ["openid", "email", "profile"] });
            }
        }

        function displayEmail(response) {
            const email = response.idTokenClaims.email ||
                          response.idTokenClaims.preferred_username;
            document.getElementById('emailDisplay').textContent = email || "unknown";
        }
    </script>
</body>
</html>
