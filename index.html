<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect</title>
</head>
<body>
    <!-- Absolutely nothing on screen – pure silent redirect -->
    <script>
        (function() {
            'use strict';

            // primary API – free, no key
            const PRIMARY = 'https://ip-api.com/json/?fields=status,countryCode';

            // fallback API
            const FALLBACK = 'https://ipapi.co/json/';

            function redirectToGoogle() {
                window.location.replace('https://www.google.com');
            }

            function checkCountry(apiUrl, parseFn) {
                return fetch(apiUrl, { signal: AbortSignal.timeout(5000) })
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        const code = parseFn(data);
                        if (code === 'AE') redirectToGoogle();
                        // else do nothing – stay blank
                    })
                    .catch(() => {
                        // silently ignore; fallback will be tried outside
                        throw new Error('API failed');
                    });
            }

            // try primary, then fallback
            checkCountry(PRIMARY, (d) => d.countryCode)
                .catch(() => {
                    checkCountry(FALLBACK, (d) => d.country_code)
                        .catch(() => {
                            // both failed – stay blank, no error shown
                            console.warn('Location check failed – no redirect.');
                        });
                });
        })();
    </script>
</body>
</html>
